name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e ".[test,quality]"
      - name: Lint
        run: python -m ruff check src tests
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: python -m pytest -q
